<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>接口查询 - XI狐ERP</title>
<link rel="stylesheet" href="/static/style.css">
<style>
body{background:var(--bg)}
.wrap{max-width:1560px;margin:0 auto;padding:0 12px 32px}

/* 工具条 */
.apibar{background:#fff;border:1px solid var(--bd);border-radius:4px;margin-top:10px;
  padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.apibar .fld{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.apibar input[type=search]{height:30px;width:340px;border:1px solid var(--bd-d);border-radius:4px;
  padding:0 10px;font-size:13px;color:var(--txt);background:#fff}
.apibar input[type=search]:focus{outline:none;border-color:var(--blue)}
.apibar select{height:30px;border:1px solid var(--bd-d);border-radius:4px;padding:0 6px;
  font-size:12.5px;background:#fff;color:var(--txt)}
.stat{font-size:12.5px;color:var(--txt-2)}
.stat b{color:var(--blue);font-size:15px;margin:0 2px}

/* 布局 */
.layout{display:grid;grid-template-columns:196px 1fr;gap:12px;margin-top:10px;align-items:start}
.cats{background:#fff;border:1px solid var(--bd);border-radius:4px;padding:6px;position:sticky;top:10px}
.cat{display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:7px 9px;border-radius:3px;font-size:13px;color:var(--txt-2);cursor:pointer}
.cat:hover{background:var(--blue-l);color:var(--blue)}
.cat.on{background:var(--blue-l);color:var(--blue);font-weight:600}
.cat .n{font-size:11.5px;color:var(--muted);background:#f2f4f7;border-radius:9px;padding:1px 7px}
.cat.on .n{background:#fff;color:var(--blue)}

/* 分组卡片 */
.group{margin-bottom:14px}
.ghead{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding-left:2px}
.ghead h2{font-size:14px;font-weight:600;margin:0;color:var(--txt)}
.ghead .sub{font-size:12px;color:var(--muted)}
.ghead .line{flex:1;height:1px;background:var(--bd)}

/* 接口行 */
.api{background:#fff;border:1px solid var(--bd);border-radius:4px;margin-bottom:8px;overflow:hidden}
.api-top{display:flex;align-items:flex-start;gap:10px;padding:10px 12px}
.m{flex:0 0 auto;min-width:44px;height:20px;line-height:20px;text-align:center;border-radius:3px;
  font-size:11px;font-weight:700;letter-spacing:.3px;color:#fff;margin-top:1px}
.m.GET{background:#02a15c}.m.POST{background:#2b5fd0}.m.BOTH{background:#7a5af8}
.api-main{flex:1;min-width:0}
.api-name{font-size:13.5px;font-weight:600;color:var(--txt);display:flex;flex-wrap:wrap;
  align-items:center;gap:8px}
.path{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#334;margin-top:4px;
  background:#f7f8fa;border:1px solid #eef0f4;border-radius:3px;padding:4px 7px;
  word-break:break-all;display:flex;align-items:center;gap:8px}
.path span.t{flex:1;min-width:0}
.act{flex:0 0 auto;display:flex;gap:6px}
.mini{font-size:11px;cursor:pointer;border-radius:3px;padding:1px 7px;border:1px solid #cfe0ff;
  background:var(--blue-l);color:var(--blue)}
.mini:hover{background:#dbe8ff}
.mini.detail{border-color:#d8cffa;background:#f3effe;color:#6b46c1}
.mini.detail:hover{background:#eae2ff}
.api-desc{font-size:12.5px;color:var(--txt-2);margin-top:6px;line-height:1.55}
.api-desc code{background:#f4f6f9;border-radius:3px;padding:1px 4px;font-size:11.5px;color:#455}
.api-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tag{font-size:11px;padding:1px 7px;border-radius:9px;background:#f2f4f7;color:var(--txt-2)}
.tag.ok{background:#e8f7ef;color:#0a7d47}
.tag.part{background:#fff5e6;color:#b5701a}
.tag.todo{background:#fdecec;color:#c0392b}
.tag.path{background:#eef2fb;color:#3a5fa8;font-family:ui-monospace,Menlo,monospace}
.tag.sec{background:#f3effe;color:#6b46c1}
.tag.star{background:#fff7e0;color:#b8860b;font-weight:700}
.api-name .st{color:#f0a500;font-size:13px;letter-spacing:-1px}
.cat .st{color:#f0a500;margin-right:2px}
.hit{background:#fff6a8}
.empty{background:#fff;border:1px dashed var(--bd);border-radius:4px;padding:44px;
  text-align:center;color:var(--muted);font-size:13px}

/* 详情抽屉 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.38);z-index:900;display:none}
.mask.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,94vw);background:#fff;z-index:901;
  box-shadow:-8px 0 28px rgba(0,0,0,.16);transform:translateX(100%);transition:transform .22s ease;
  display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.dhead{padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:flex-start;gap:10px}
.dhead .h{flex:1;min-width:0}
.dhead .t1{font-size:15px;font-weight:600;color:var(--txt);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dhead .t2{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:#556;
  margin-top:6px;word-break:break-all;background:#f7f8fa;border:1px solid #eef0f4;border-radius:3px;padding:4px 7px}
.dclose{flex:0 0 auto;width:26px;height:26px;line-height:24px;text-align:center;border-radius:3px;
  border:1px solid var(--bd-d);background:#fff;color:var(--muted);cursor:pointer;font-size:15px}
.dclose:hover{border-color:var(--blue);color:var(--blue)}
.dbody{flex:1;overflow:auto;padding:14px 16px 28px}
.dsec{margin-bottom:16px}
.dsec h3{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 7px;letter-spacing:.3px;
  text-transform:none;display:flex;align-items:center;gap:6px}
.dsec h3::before{content:"";width:3px;height:12px;background:var(--blue);border-radius:2px}
pre.code{margin:0;background:#0f172a;color:#dbe6ff;border-radius:4px;padding:10px 12px;
  font-size:11.8px;line-height:1.55;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
pre.code.json{color:#c9f1d8}
table.facts{width:100%;border-collapse:collapse;font-size:12.5px}
table.facts th,table.facts td{border:1px solid var(--bd);padding:6px 9px;text-align:left;vertical-align:top}
table.facts th{background:#f7f8fa;color:var(--muted);font-weight:600;width:130px}
ul.notes{margin:0;padding-left:18px}
ul.notes li{font-size:12.8px;color:var(--txt-2);line-height:1.7;margin-bottom:3px}
ul.notes li code{background:#f4f6f9;border-radius:3px;padding:1px 4px;font-size:11.5px;color:#455}
ul.notes li b{color:#b5701a}
.dfoot{border-top:1px solid var(--bd);padding:10px 16px;font-size:12px;color:var(--muted);display:flex;
  justify-content:space-between;gap:10px;flex-wrap:wrap}
.dfoot a{color:var(--blue);cursor:pointer;text-decoration:none}
.nodata{font-size:12.8px;color:var(--muted);background:#fafbfc;border:1px dashed var(--bd);
  border-radius:4px;padding:14px;text-align:center}

@media(max-width:900px){.layout{grid-template-columns:1fr}.cats{position:static;display:flex;
  flex-wrap:wrap;gap:4px}.cat{flex:0 0 auto}}
</style>
</head>
<body>
<header class="topbar topbar-slim">
  <div class="logo"><span class="logo-mark">狐</span><span class="logo-text">XI狐ERP</span></div>
  <div class="seg seg-top">
    <button class="seg-btn" onclick="location.href='/'">数据表格</button>
    <button class="seg-btn" onclick="location.href='/?view=product'">产品视角</button>
    <button class="seg-btn" onclick="location.href='/?view=online'">在线产品</button>
    <button class="seg-btn" onclick="location.href='/?view=adcreator'">广告管理</button>
    <button class="seg-btn" onclick="location.href='/?view=bulk'">批量建广告</button>
    <button class="seg-btn" onclick="location.href='/static/hourly.html'">分时分析</button>
    <button class="seg-btn active">接口查询</button>
    <button class="seg-btn" onclick="location.href='/static/daily-probe.html'">广告数据</button>
  </div>
  <div class="topbar-right">
    <span class="muted" id="buildTag">SP 广告接口全集</span>
  </div>
</header>

<div class="wrap">
  <div class="apibar">
    <div class="fld">
      <input type="search" id="q" placeholder="搜索接口名 / 路径 / 关键字，如 campaign、否定、placement">
    </div>
    <div class="fld">
      <label>状态</label>
      <select id="fStatus">
        <option value="">全部</option>
        <option value="ok">已实测</option>
        <option value="part">部分验证</option>
        <option value="todo">未验证</option>
      </select>
    </div>
    <div class="fld">
      <label>方法</label>
      <select id="fMethod">
        <option value="">全部</option>
        <option value="GET">GET</option>
        <option value="POST">POST</option>
      </select>
    </div>
    <label class="fld" style="cursor:pointer">
      <input type="checkbox" id="fDetail" style="accent-color:var(--blue)"> 只看有详情的
    </label>
    <label class="fld" style="cursor:pointer">
      <input type="checkbox" id="fStar" style="accent-color:#f0a500"> 只看重点 ★
    </label>
    <span class="stat">共 <b id="cTotal">0</b> 个接口 · 已实测 <b id="cOk">0</b> · 重点 <b id="cStar">0</b> · 有详情 <b id="cDetail">0</b></span>
  </div>

  <div class="layout">
    <aside class="cats" id="cats"></aside>
    <main id="list"></main>
  </div>
</div>

<!-- 详情抽屉 -->
<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dhead">
    <div class="h">
      <div class="t1" id="dTitle"></div>
      <div class="t2" id="dPath"></div>
    </div>
    <button class="dclose" id="dClose" title="关闭 (Esc)">×</button>
  </div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot">
    <span id="dFoot"></span>
    <a id="dCopy">复制路径</a>
  </div>
</aside>

<script>
/* ============ 接口数据（来源：docs/sellfox_sp_create_api.md 第 1-21 节） ============ */
const GW = "/api/gw/sellfox/sellfox-cpc/api/sellfox";

const DATA = [
  /* ============ ★ 重点 1：在线产品 ============ */
  {g:"★ 在线产品", n:"子体（在线产品）列表", m:"POST", p:"/api/gw/sellfox/sellfox-product/sellfox/product/pageList", star:true,
   d:"<b>在线产品取数接口</b>（含父子关系、卖家 SKU、ASIN、价格、库存、状态等），产品视角/批量建广告的数据源。",
   s:"ok", t:["★重点","在线产品"], sec:"—",
   det:{facts:[["网关","sellfox-product，不是 sellfox-cpc（注意前缀不同）"],
              ["用途","产品视角、批量建广告选品、父子体配对"],
              ["配套","父体列表走另一个网关 /api/parent/product/pageList.json"]],
     req:"POST /api/gw/sellfox/sellfox-product/sellfox/product/pageList\n{ \"pageNo\":1, \"pageSize\":50, \"shopIdList\":[\"711811\"], \"searchValue\":\"\" }",
     notes:["子体接口返回的 SKU 是卖家 SKU，与广告产品库 id、ASIN 三者需分开保存。"]}},

  {g:"★ 在线产品", n:"父体列表", m:"POST", p:"/api/parent/product/pageList.json", star:true,
   d:"父体（parent）与子体归属关系，走 <code>/api/parent</code> 网关，不在 sellfox-product 下。",
   s:"ok", t:["★重点","在线产品","另一网关"], sec:"—",
   det:{facts:[["网关差异","/api/parent/product/pageList.json（非 gw/sellfox）"],
              ["用途","父体聚合、按父体生成活动（批量建广告）"]],
     notes:["父子关系也可从子体行的 parentAsin 字段反推，两个来源要能对上账。"]}},

  {g:"★ 在线产品", n:"店铺 / 广告组合权限", m:"POST", p:GW+"/commonMultiShop/getPortfolioListProductRight",
   d:"当前账号可见的店铺 × 广告组合清单（含 <code>hasAuth</code>）。",
   s:"ok", t:["在线产品","基础数据"], sec:"21",
   det:{facts:[["返回","data.page.rows[{shopId, portfolioId, portfolioName, siteName, hasAuth}]"],
              ["实测","金梧汇辰 6 个组合，hasAuth:false 表示无操作权限"]],
     req:"{\"shopIdList\":[\"711811\"],\"pageNo\":1,\"pageSize\":1000}"}},

  /* ============ ★ 重点 2：产品 × 三体系 × 24 时段 ============ */
  {g:"★ 产品三体系分时", n:"产品级分时（三体系入口）", m:"POST", p:GW+"/multiple/adProduct/getAllProductHourData", star:true,
   d:"<b>按产品 × 三体系 × 24 时段</b>取指标，<code>dateModel</code> 切换体系：<code>HOURLY</code>（广告总量）/ <code>HOURLY_KEYWORD</code>（关联方式/投放）/ <code>HOURLY_PLACEMENT</code>（广告位）。",
   s:"ok", t:["★重点","分时","三体系"], sec:"—",
   det:{facts:[["HOURLY","广告总量 → periodReportList 24 行（每小时一行）"],
              ["HOURLY_KEYWORD","广告产品-投放（关键词/匹配方式）→ 行含 target 维度 + detail"],
              ["HOURLY_PLACEMENT","广告产品-广告位 → 4 行 广告位 × detail[24]"],
              ["实测","B0HLCZH8B4：HOURLY 24 行 / PLACEMENT 4 行×24 小时；KEYWORD 0（自动活动无词）"],
              ["入参要点","adIds 必传（产品实例 id），pageSize 200"],
              ["省请求技巧","先请求 HOURLY，全天曝光=花费=0 则跳过另两个体系"]],
     req:"{\"type\":\"sp\",\"startDate\":\"2026-11-06\",\"endDate\":\"2026-11-06\",\n \"analyzeStartDate\":\"2026-11-06\",\"analyzeEndDate\":\"2026-11-06\",\n \"dateModel\":\"HOURLY\",\n \"adIds\":[\"79503967439\"],\"campaignIdList\":[\"276956384537792\"],\n \"shopIdList\":[\"711811\"],\"pageNo\":1,\"pageSize\":200,\"fromSingle\":true,\n \"weekList\":[\"1\",\"2\",\"3\",\"4\",\"5\",\"6\",\"7\"],\"isHide\":true}",
     resp:"{\"code\":0,\"data\":{\"currency\":\"JPY\",\n  \"periodReportList\":[{\"impressions\":0,\"clicks\":0,\"adCost\":\"0.0\",\"detail\":[24 小时]}, ...],\n  \"aggregateDataVo\":{...},\"hour\":[72 个指标 × N 值]}}",
     notes:["detail 是「该行对象（产品/投放/广告位）× 24 小时」的明细，一个请求即可拿到产品级全时段。",
            "三个体系必须分别请求，同一请求只返回一个体系。"]}},

  {g:"★ 产品三体系分时", n:"产品分时-广告总量（HOURLY）", m:"POST", p:GW+"/multiple/adProduct/getAllProductHourData（dateModel=HOURLY）", star:true,
   d:"产品在该天 24 小时的曝光/点击/花费/订单/销售额等，用于分时分析页主图。",
   s:"ok", t:["★重点","HOURLY"], sec:"—",
   det:{facts:[["返回行数","24（每小时一行）"],
              ["指标","impressions/clicks/ctr/cvr/acos/roas/adCost/orders/adSale…共 30+"]],
     metrics_note:""}},

  {g:"★ 产品三体系分时", n:"产品分时-关联方式（HOURLY_KEYWORD）", m:"POST", p:GW+"/multiple/adProduct/getAllProductHourData（dateModel=HOURLY_KEYWORD）", star:true,
   d:"产品 × 投放（关键词/商品定向/自动匹配位）× 24 小时。",
   s:"ok", t:["★重点","HOURLY_KEYWORD"], sec:"—",
   det:{facts:[["行维度","每个投放一行，内含 detail[24] 小时明细"],
              ["实测","自动投放活动下返回 0 行（没有关键词），手动活动有数据"],
              ["落库","对应 fact_ads_match（product_code + match_code）"]],
     notes:["自动活动没有关键词，这个体系只在手动活动里有内容。"]}},

  {g:"★ 产品三体系分时", n:"产品分时-广告位（HOURLY_PLACEMENT）", m:"POST", p:GW+"/multiple/adProduct/getAllProductHourData（dateModel=HOURLY_PLACEMENT）", star:true,
   d:"产品 × 广告位（顶部/其余/详情页/站外）× 24 小时。",
   s:"ok", t:["★重点","HOURLY_PLACEMENT"], sec:"—",
   det:{facts:[["实测","返回 4 行（4 个广告位），每行 detail[24]"],
              ["用途","判断某产品在「搜索结果顶部」的时段表现"],
              ["落库","对应 fact_ads_placement"]],
     resp:"periodReportList: 4 行（顶部/其余搜索/商品详情/站外），每行 detail 长度 24"}},

  /* ============ ★ 重点 3：活动/组及其下所有层级的最小粒度 ============ */
  {g:"最小粒度分时（活动/组/投放）", n:"分时统一入口（活动 / 广告组 / 投放）", m:"POST", p:GW+"/multiple/target/getAllTargetHourData", star:true,
   d:"一个接口按 <code>dateModel</code> + 维度 id 取不同层级：<b>活动</b>（campaignIdList）/ <b>广告组</b>（+groupIdList）/ <b>投放</b>（+targetId）。",
   s:"ok", t:["★重点","最小粒度","分时"], sec:"—",
   det:{facts:[["活动级","campaignIdList=[cid] → hour 72 指标 × 24 小时"],
              ["广告组级","+ groupIdList=[gid] → 同上，实测 24 小时曝光 [21,8,14,63,15…]"],
              ["投放级","+ targetId=<内部id> → 单个投放 24 小时"],
              ["周期","startDate=endDate=当天；DAILY 模式返回单点汇总"]],
     req:"{\"shopIdList\":[711811],\"shopId\":\"711811\",\"adType\":\"sp\",\"type\":\"sp\",\n \"campaignIdList\":[\"276956384537792\"],\"groupIdList\":[\"<组id>\"],\"targetId\":\"\",\n \"startDate\":\"2026-11-06\",\"endDate\":\"2026-11-06\",\n \"analyzeStartDate\":\"2026-11-06\",\"analyzeEndDate\":\"2026-11-06\",\n \"dateModel\":\"HOURLY\",\"weekList\":[\"1\",\"2\",\"3\",\"4\",\"5\",\"6\",\"7\"],\n \"pageNo\":1,\"pageSize\":200,\"fromSingle\":true,\"isHide\":true}",
     resp:"{\"code\":0,\"data\":{\"hour\":[{\"name\":\"impressions\",\"records\":[{value:21},…24]},…72 个指标],\n  \"periodReportList\":[24 行],\"aggregateDataVo\":{…},\"currency\":\"JPY\"}}",
     notes:["hour[] 是「指标为中心」的转置结构：每个指标一条，records 是 24 小时值。",
            "periodReportList 是「小时为中心」：24 行，每行全指标，直接落库更省事。"]}},

  {g:"最小粒度分时（活动/组/投放）", n:"dateModel 取值（实测）", m:"POST", p:"HOURLY · HOURLY_ASIN · HOURLY_KEYWORD · HOURLY_PLACEMENT · DAILY", star:true,
   d:"实测只有这 5 个值有效，其余（HOURLY_TARGET / HOURLY_SEARCH_TERM / HOURLY_CAMPAIGN / HOURLY_GROUP）统一报 <code>160000 系统异常</code>。",
   s:"ok", t:["★重点","枚举实测"], sec:"—",
   det:{facts:[["HOURLY","活动 / 广告组 / 投放（按入参 id 决定）→ hour + 24 行"],
              ["HOURLY_ASIN","广告产品维度 → 每产品一行 + detail[24]"],
              ["HOURLY_KEYWORD","投放/匹配维度 → 每投放一行 + detail[24]"],
              ["HOURLY_PLACEMENT","广告位维度 → 每广告位一行 + detail[24]"],
              ["DAILY","当天汇总（hour 只有 1 条）"],
              ["无效值","HOURLY_TARGET / HOURLY_SEARCH_TERM / HOURLY_SEARCHTERM / HOURLY_CAMPAIGN / HOURLY_GROUP 全部 160000"]],
     notes:["层级不是靠 dateModel 区分，而是靠传哪个 id（campaign / group / target）。"]}},

  {g:"最小粒度分时（活动/组/投放）", n:"层级 → 接口对照表", m:"BOTH", p:"日级用 getAll*Data，分时用 getAllTargetHourData / getAllProductHourData", star:true,
   d:"从活动到最细粒度的完整取数路径（日级 / 24 小时）。",
   s:"ok", t:["★重点","对照表"], sec:"—",
   det:{facts:[
     ["活动 · 日","campaign/getAllCampaignData（startDate=endDate）"],
     ["活动 · 小时","target/getAllTargetHourData + dateModel=HOURLY + campaignIdList"],
     ["广告组 · 日","multiple/group/getAllGroupData"],
     ["广告组 · 小时","同上 + groupIdList"],
     ["投放 · 日","multiple/target/getAllTargetData（targetType=auto/keyword/targeting）"],
     ["投放 · 小时","同上 + targetId"],
     ["关键词/匹配 · 小时","target/getAllTargetHourData + dateModel=HOURLY_KEYWORD"],
     ["广告产品 · 日","multiple/adProduct/getAdProductList"],
     ["广告产品 · 小时","adProduct/getAllProductHourData + dateModel=HOURLY + adIds"],
     ["广告位 · 日","multiple/placement/getAllPlacementData"],

/* ============ 渲染 ============ */
const STATUS = {ok:["已实测","ok"], part:["部分验证","part"], todo:["未验证","todo"]};
const listEl = document.getElementById("list");
const catsEl = document.getElementById("cats");
const qEl = document.getElementById("q");
const fStatusEl = document.getElementById("fStatus");
const fMethodEl = document.getElementById("fMethod");
const fDetailEl = document.getElementById("fDetail");
const fStarEl = document.getElementById("fStar");
let activeCat = "";
let kw = "";

/* 分组顺序：★ 重点分组优先，其余按首次出现顺序 */
const _seen = [...new Set(DATA.map(x => x.g))];
const GROUPS = _seen.filter(g=>g.startsWith("★")).concat(_seen.filter(g=>!g.startsWith("★")));

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function hi(s){
  const t = esc(s);
  if(!kw) return t;
  try{ return t.replace(new RegExp("("+kw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),'<span class="hit">$1</span>'); }
  catch(e){ return t; }
}
function hasDetail(x){ return !!(x.det && (x.det.req || x.det.resp || (x.det.facts&&x.det.facts.length) || (x.det.notes&&x.det.notes.length))); }
function match(x){
  if(activeCat && x.g !== activeCat) return false;
  if(fStatusEl.value && x.s !== fStatusEl.value) return false;
  if(fMethodEl.value && x.m !== fMethodEl.value && x.m !== "BOTH") return false;
  if(fDetailEl.checked && !hasDetail(x)) return false;
  if(fStarEl.checked && !x.star) return false;
  if(!kw) return true;
  const blob = [x.g,x.n,x.p,x.d,(x.t||[]).join(" "), hasDetail(x)?JSON.stringify(x.det):""].join(" ").toLowerCase();
  return blob.includes(kw.toLowerCase());
}

function renderCats(){
  const counts = {};
  GROUPS.forEach(g => counts[g] = DATA.filter(x=>x.g===g).length);
  const items = [["","全部接口",DATA.length]].concat(GROUPS.map(g=>[g,g,counts[g]]));
  catsEl.innerHTML = items.map(([v,label,n])=>
    '<div class="cat '+(activeCat===v?"on":"")+'" data-cat="'+esc(v)+'">'+
      '<span>'+esc(label)+'</span><span class="n">'+n+'</span></div>').join("");
  catsEl.querySelectorAll(".cat").forEach(el=>{
    el.onclick = ()=>{ activeCat = el.dataset.cat; renderCats(); renderList(); };
  });
}

function cardHtml(x, idx){
  const st = STATUS[x.s] || ["未知",""];
  return '<div class="api">'+
    '<div class="api-top">'+
      '<span class="m '+esc(x.m)+'">'+esc(x.m==="BOTH"?"MIX":x.m)+'</span>'+
      '<div class="api-main">'+
        '<div class="api-name">'+(x.star?'<span class="st" title="重点接口">★</span>':'')+hi(x.n)+
          '<span class="tag '+st[1]+'">'+st[0]+'</span>'+
          (x.star?'<span class="tag star">重点</span>':'')+
          (x.sec && x.sec!=="—" ?'<span class="tag sec">&sect;'+esc(x.sec)+'</span>':'')+
        '</div>'+
        '<div class="path"><span class="t">'+hi(x.p)+'</span>'+
          '<span class="act">'+
            (hasDetail(x)?'<span class="mini detail" data-detail="'+idx+'">详情</span>':'')+
            '<span class="mini" data-path="'+esc(x.p)+'">复制</span>'+
          '</span>'+
        '</div>'+
        '<div class="api-desc">'+x.d+'</div>'+
        ((x.t&&x.t.length)?'<div class="api-meta">'+x.t.map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+'</div>':'')+
      '</div>'+
    '</div></div>';
}

function renderList(){
  const rows = DATA.map((x,i)=>({x,i})).filter(o=>match(o.x));
  document.getElementById("cTotal").textContent = DATA.length;
  document.getElementById("cOk").textContent = DATA.filter(x=>x.s==="ok").length;
  document.getElementById("cStar").textContent = DATA.filter(x=>x.star).length;
  document.getElementById("cDetail").textContent = DATA.filter(hasDetail).length;
  if(!rows.length){ listEl.innerHTML = '<div class="empty">没有匹配的接口</div>'; return; }

  const byGroup = {};
  rows.forEach(o => (byGroup[o.x.g] = byGroup[o.x.g] || []).push(o));

  listEl.innerHTML = Object.keys(byGroup)
    .sort((a,b)=>GROUPS.indexOf(a)-GROUPS.indexOf(b))
    .map(g=>{
    const arr = byGroup[g];
    const ok = arr.filter(o=>o.x.s==="ok").length;
    return '<section class="group">'+
      '<div class="ghead"><h2>'+esc(g)+'</h2>'+
        '<span class="sub">'+arr.length+' 个 · 已实测 '+ok+'</span><span class="line"></span></div>'+
      arr.map(o=>cardHtml(o.x, o.i)).join("")+
    '</section>';
  }).join("");

  listEl.querySelectorAll(".mini.detail").forEach(el=>{
    el.onclick = ()=> openDetail(Number(el.dataset.detail));
  });
  listEl.querySelectorAll(".mini[data-path]").forEach(el=>{
    el.onclick = ()=> copyText(el.dataset.path, el);
  });
}

/* ---------- 详情抽屉 ---------- */
const maskEl = document.getElementById("mask");
const drawerEl = document.getElementById("drawer");
const dTitle = document.getElementById("dTitle");
const dPath = document.getElementById("dPath");
const dBody = document.getElementById("dBody");
const dFoot = document.getElementById("dFoot");
const dCopy = document.getElementById("dCopy");
let curPath = "";

function openDetail(idx){
  const x = DATA[idx];
  if(!x) return;
  curPath = x.p;
  const st = STATUS[x.s] || ["未知",""];
  dTitle.innerHTML = '<span class="m '+esc(x.m)+'" style="margin-top:0">'+esc(x.m==="BOTH"?"MIX":x.m)+'</span>'+
    '<span>'+esc(x.n)+'</span><span class="tag '+st[1]+'">'+st[0]+'</span>'+
    (x.sec && x.sec!=="—" ?'<span class="tag sec">&sect;'+esc(x.sec)+'</span>':'');
  dPath.textContent = x.p;

  const det = x.det || {};
  let html = '';

  if(det.facts && det.facts.length){
    html += '<div class="dsec"><h3>实测记录</h3><table class="facts"><tbody>'+
      det.facts.map(([k,v])=>'<tr><th>'+esc(k)+'</th><td>'+v+'</td></tr>').join("")+
      '</tbody></table></div>';
  }
  if(det.req){
    html += '<div class="dsec"><h3>请求示例</h3><pre class="code">'+esc(det.req)+'</pre></div>';
  }
  if(det.resp){
    html += '<div class="dsec"><h3>响应示例</h3><pre class="code json">'+esc(det.resp)+'</pre></div>';
  }
  if(det.notes && det.notes.length){
    html += '<div class="dsec"><h3>注意 / 踩坑</h3><ul class="notes">'+
      det.notes.map(n=>'<li>'+n+'</li>').join("")+'</ul></div>';
  }
  if(!html){
    html = '<div class="nodata">该接口暂无更多记录，详见文档 '+
      (x.sec && x.sec!=="—" ? ('&sect;'+esc(x.sec)) : '对应章节')+'。</div>';
  }
  dBody.innerHTML = html;
  dFoot.textContent = '所属分类：' + x.g + (x.sec && x.sec!=="—" ? (' · 文档 §' + x.sec) : '');
  maskEl.classList.add("on");
  drawerEl.classList.add("on");
  drawerEl.setAttribute("aria-hidden","false");
  dBody.scrollTop = 0;
}
function closeDetail(){
  maskEl.classList.remove("on");
  drawerEl.classList.remove("on");
  drawerEl.setAttribute("aria-hidden","true");
}
document.getElementById("dClose").onclick = closeDetail;
maskEl.onclick = closeDetail;
document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeDetail(); });
dCopy.onclick = ()=> copyText(curPath, dCopy);

/* ---------- 复制 ---------- */
async function copyText(txt, el){
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  if(!el) return;
  const old = el.textContent; el.textContent = "已复制";
  setTimeout(()=>{ el.textContent = old; }, 1200);
}

qEl.addEventListener("input", ()=>{ kw = qEl.value.trim(); renderList(); });
fStatusEl.addEventListener("change", renderList);
fMethodEl.addEventListener("change", renderList);
fDetailEl.addEventListener("change", renderList);
fStarEl.addEventListener("change", renderList);
renderCats(); renderList();
</script>
