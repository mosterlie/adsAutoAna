<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>广告产品分时分析 - 赛狐ERP</title>
<link rel="stylesheet" href="/static/style.css">
<style>
:root{
  --c1:#2b5fd0; --c2:#02a15c; --c3:#f08c22; --c4:#9099a6;
}
body{background:var(--bg)}
.wrap{max-width:1440px;margin:0 auto;padding:0 12px 28px}

/* 筛选条 */
.hfilter{background:#fff;border:1px solid var(--bd);border-radius:4px;margin-top:10px;
  padding:12px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.hfilter .fld{display:flex;align-items:center;gap:6px}
.hfilter .fld.grow{flex:1;min-width:260px}
.hfilter select{max-width:420px}
.hfilter .fld.metrics{flex-wrap:wrap;gap:6px;max-width:100%}

/* 广告产品：可输入筛选的下拉框（产品多时靠 select 找不动） */
.combo{position:relative;flex:1;min-width:240px}
.combo > input{width:100%;height:30px;border:1px solid var(--bd-d);border-radius:4px;
  padding:0 26px 0 8px;font-size:13px;color:var(--txt);background:#fff}
.combo > input:focus{outline:none;border-color:var(--blue)}
.combo::after{content:"▾";position:absolute;right:9px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:11px;pointer-events:none}
.combo-list{position:absolute;top:100%;left:0;right:0;z-index:60;margin-top:4px;background:#fff;
  border:1px solid var(--bd-d);border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.12);
  max-height:300px;overflow:auto}
.combo-item{padding:7px 10px;font-size:12.5px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.combo-item:hover{background:var(--blue-l);color:var(--blue)}
.combo-item.on{background:var(--blue-l);color:var(--blue);font-weight:600}
.combo-empty{padding:10px;color:var(--muted);font-size:12px;text-align:center}

/* 获取数据按钮 */
.btn-fetch{height:30px;padding:0 14px;border-radius:4px;border:1px solid var(--blue);
  background:var(--blue);color:#fff;font-size:13px;cursor:pointer;white-space:nowrap}
.btn-fetch:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn-fetch:disabled{background:#a9bde8;border-color:#a9bde8;cursor:not-allowed}
.fetch-msg{font-size:12px;color:var(--txt-2);max-width:300px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

/* 日期多选：只做下拉勾选，选完点空白处收起 */
.combo-date{flex:0 0 auto;width:220px}
.combo-date > input{cursor:pointer}
.combo-item.check{display:flex;align-items:center;gap:7px}
.combo-item.check input{accent-color:var(--blue);cursor:pointer}
.combo-item.check span{flex:1}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:10px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:4px;padding:12px 14px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:21px;font-weight:600;margin-top:4px;letter-spacing:-.2px}
.kpi .s{font-size:11.5px;color:var(--txt-2);margin-top:2px}
.kpi.hl .v{color:var(--blue)}

/* 产品卡片 */
.pcard{background:#fff;border:1px solid var(--bd);border-radius:4px;margin-top:10px;padding:12px 14px;
  display:flex;gap:14px;align-items:center}
.pcard img{width:56px;height:56px;object-fit:contain;border:1px solid var(--bd);border-radius:4px;background:#fafbfc}
.pcard .meta{flex:1;min-width:0}
.pcard .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .sub{font-size:12px;color:var(--txt-2);margin-top:3px;display:flex;gap:14px;flex-wrap:wrap}
.pcard .tag{background:var(--blue-l);color:var(--blue);border-radius:3px;padding:1px 6px;font-size:11.5px}

/* 体系卡片 */
.sys{background:#fff;border:1px solid var(--bd);border-radius:4px;margin-top:10px}
.sys-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--bd)}
.sys-head h3{font-size:13.5px;font-weight:600}
.sys-head .sum{margin-left:auto;font-size:12px;color:var(--txt-2)}
.sys-body{padding:12px 14px 6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--txt-2)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* 堆叠柱（多天时按天分组，组间留白，时间轴仍连续） */
.bars{display:flex;align-items:flex-end;gap:18px;height:170px;padding-top:6px}
.daygrp{display:flex;align-items:flex-end;gap:4px;flex:1;min-width:0;height:100%}
.daylabels{display:flex;gap:18px;margin-top:3px}
.daylabels span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;min-width:0}
.stack{flex:1;width:100%;display:flex;flex-direction:column-reverse;justify-content:flex-start;
  border-radius:2px;overflow:hidden;background:#f7f8fa;position:relative}
/* 注意: 不能叫 .seg, 会与顶栏分段控件的 .seg 冲突(把该控件撑成 100% 宽) */
.bseg{width:100%;transition:height .2s}
.bl{font-size:10.5px;color:var(--muted);flex:0 0 auto}
.bar:hover .bl{color:var(--blue);font-weight:600}

/* 明细表 */
.dtable{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.dtable th,.dtable td{border-bottom:1px solid #f0f1f4;padding:5px 6px;text-align:right;white-space:nowrap}
.dtable th:first-child,.dtable td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
.dtable thead th{background:#fafbfc;color:var(--txt-2);font-weight:500;position:sticky;top:0}
/* 多天表头两行：第二行（小时）贴着第一行（日期）粘住 */
.dtable thead tr:nth-child(2) th{top:29px}
.dtable tbody tr:hover td{background:#f7faff}
.dtable .zero{color:#c8ccd4}
.tbl-title{font-size:12px;color:var(--muted);margin:12px 0 5px}
.tbl-wrap{overflow:auto;max-height:280px;border:1px solid var(--bd);border-radius:4px}
.tbl-wrap::-webkit-scrollbar{height:8px;width:8px}
.tbl-wrap::-webkit-scrollbar-thumb{background:#d6dae1;border-radius:4px}

/* 顶栏按钮：蓝底上白字，且不被 flex 压缩（否则文字被挤没） */
.topbar-right{flex:0 0 auto;white-space:nowrap}
.topbar-right .btn-ghost{background:rgba(255,255,255,.16);color:#fff;
  border:1px solid rgba(255,255,255,.45);flex:0 0 auto;white-space:nowrap}
.topbar-right .btn-ghost:hover{background:rgba(255,255,255,.3);color:#fff}

.empty{background:#fff;border:1px dashed var(--bd);border-radius:4px;margin-top:10px;
  padding:48px;text-align:center;color:var(--muted)}
.mini-btn{height:26px;padding:0 9px;font-size:12px;border:1px solid var(--bd-d);border-radius:3px;
  background:#fff;color:var(--txt-2);cursor:pointer}
.mini-btn:hover{border-color:var(--blue);color:var(--blue)}
.mini-btn.on{background:var(--blue-l);border-color:#b9cdf5;color:var(--blue)}
.mini-select{height:26px;padding:0 6px;font-size:12px;border:1px solid var(--bd-d);border-radius:3px;
  background:#fff;color:var(--txt-2);cursor:pointer;max-width:140px}
.mini-select:hover{border-color:var(--blue);color:var(--blue)}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:720px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .pcard{flex-wrap:wrap}
}
</style>
</head>
<body>
<div id="app" v-cloak>
  <header class="topbar topbar-slim">
    <div class="logo"><span class="logo-mark">狐</span><span class="logo-text">赛狐ERP</span></div>
    <div class="seg seg-top">
      <button class="seg-btn" onclick="location.href='/'">数据表格</button>
      <button class="seg-btn active">分时分析</button>
    </div>
    <div class="topbar-right">
      <span class="muted" v-if="detail">{{ detail.product.sku }}</span>
      <button class="btn btn-ghost" @click="loadProducts()">刷新</button>
    </div>
  </header>

  <div class="wrap">
    <!-- 筛选 -->
    <div class="hfilter">
      <div class="fld">
        <label>日期</label>
        <div class="combo combo-date" v-click-outside="() => dateOpen = false">
          <input readonly :value="dateText" placeholder="选择日期"
                 @click="dateOpen = !dateOpen">
          <div class="combo-list" v-if="dateOpen">
            <label class="combo-item check" v-for="d in dates" :key="d">
              <input type="checkbox" :value="d" v-model="selectedDates" @change="onDatesChange">
              <span>{{ d }}</span>
            </label>
          </div>
        </div>
      </div>
      <div class="fld grow">
        <label>广告产品</label>
        <div class="combo" v-click-outside="() => comboOpen = false">
          <input v-model="productKw" :placeholder="currentProductText"
                 @focus="comboOpen = true" @input="comboOpen = true">
          <div class="combo-list" v-if="comboOpen">
            <div class="combo-item" v-for="p in filteredProducts" :key="p.product_code"
                 :class="{on: String(p.product_code) === String(productCode)}"
                 @click="pickProduct(p)">
              {{ p.sku }} / {{ p.asin }} · 曝光 {{ fmt(p.imp) }}
            </div>
            <div class="combo-empty" v-if="!filteredProducts.length">无匹配产品</div>
          </div>
        </div>
      </div>
      <div class="fld metrics">
        <label>指标</label>
        <button v-for="m in metrics" :key="m.key" class="mini-btn"
                :class="{on: metric === m.key}" @click="metric = m.key">{{ m.label }}</button>
        <select class="mini-select" @change="onMetricPick">
          <option value="">更多指标…</option>
          <option v-for="k in extraMetricKeys" :key="k" :value="k">{{ metricName(k) }}</option>
        </select>
      </div>
      <div class="fld">
        <button class="btn-fetch" :disabled="fetching || !productCode"
                @click="startFetch">{{ fetching ? '获取中…' : '获取数据' }}</button>
        <span class="fetch-msg" v-if="fetchMsg" :title="fetchMsg">{{ fetchMsg }}</span>
      </div>
    </div>

    <div v-if="loading" class="empty">加载中…</div>
    <div v-else-if="!detail" class="empty">暂无数据，请先采集该日期的广告产品分时数据</div>

    <template v-else>
      <!-- 产品信息 -->
      <div class="pcard">
        <div style="width:56px;height:56px;border:1px solid var(--bd);border-radius:4px;
                    background:#fafbfc;display:flex;align-items:center;justify-content:center;
                    font-size:10.5px;color:var(--muted);text-align:center;line-height:1.2;padding:4px">
          {{ detail.product.asin }}
        </div>
        <div class="meta">
          <div class="nm">{{ detail.product.title || detail.product.sku }}</div>
          <div class="sub">
            <span>SKU <b>{{ detail.product.sku }}</b></span>
            <span>ASIN <b>{{ detail.product.asin }}</b></span>
            <span class="tag">{{ detail.campaign.name || detail.product.campaign_id }}</span>
            <span>广告组 {{ detail.ad_group.name || detail.product.ad_group_id }}</span>
            <span v-if="detail.product.portfolio_name">组合 {{ detail.product.portfolio_name }}</span>
          </div>
        </div>
        <div class="sub" style="color:var(--muted);font-size:12px">{{ dateSummary }}</div>
      </div>

      <!-- KPI -->
      <div class="kpis">
        <div class="kpi hl"><div class="k">曝光量</div><div class="v">{{ fmt(o.impressions) }}</div>
          <div class="s">{{ hoursLabel }}</div></div>
        <div class="kpi"><div class="k">点击量</div><div class="v">{{ fmt(o.clicks) }}</div>
          <div class="s">CTR {{ o.ctr }}%</div></div>
        <div class="kpi"><div class="k">花费</div><div class="v">{{ money(o.cost) }}</div>
          <div class="s">CPC {{ money(o.cpc) }}</div></div>
        <div class="kpi"><div class="k">订单</div><div class="v">{{ fmt(o.orders) }}</div>
          <div class="s">CVR {{ o.cvr }}%</div></div>
        <div class="kpi"><div class="k">销售额</div><div class="v">{{ money(o.sales) }}</div>
          <div class="s">ACOS {{ o.acos }}%</div></div>
        <div class="kpi"><div class="k">ROAS</div><div class="v">{{ o.roas }}</div>
          <div class="s">销售额 / 花费</div></div>
      </div>

      <!-- 三个体系 -->
      <div class="sys" v-for="sys in detail.systems" :key="sys.key">
        <div class="sys-head">
          <h3>{{ sys.label }}</h3>
          <span class="tag" style="font-size:11px">{{ sys.codes.length }} 个子类</span>
          <span class="sum">
            曝光 {{ fmt(sys.total.impressions) }} · 点击 {{ fmt(sys.total.clicks) }} ·
            花费 {{ money(sys.total.cost) }} · CTR {{ sys.total.ctr }}%
          </span>
        </div>
        <div class="sys-body">
          <div class="legend">
            <span v-for="c in sys.codes" :key="c.code">
              <i :style="{background: color(sys, c.code)}"></i>
              {{ c.name }} · {{ metricText(c.day) }}
            </span>
          </div>
          <div class="bars">
            <div class="daygrp" v-for="g in dayGroups" :key="g.date">
              <div class="bar" v-for="it in g.items" :key="it.idx">
                <div class="stack">
                  <div class="bseg" v-for="c in sys.codes" :key="c.code"
                       :style="{height: pct(sys, c, it.idx), background: color(sys, c.code)}"
                       :title="c.name + ' ' + it.date.slice(5) + ' ' + it.label + '时 '
                               + metricText(c.hours[it.idx])"></div>
                </div>
                <span class="bl">{{ dense && it.hour % 3 ? '' : it.hour }}</span>
              </div>
            </div>
          </div>
          <div class="daylabels" v-if="dayGroups.length > 1">
            <span v-for="g in dayGroups" :key="g.date">{{ g.date.slice(5) }}</span>
          </div>
          <div class="tbl-title">明细 · {{ metricLabel }}</div>
          <div class="tbl-wrap">
            <table class="dtable">
              <thead>
                <tr>
                  <th rowspan="2">子类</th>
                  <th v-for="g in dayGroups" :key="g.date" :colspan="g.items.length">
                    {{ g.date.slice(5) }}
                  </th>
                  <th rowspan="2">合计</th>
                </tr>
                <tr>
                  <th v-for="it in flatAxis" :key="it.idx">{{ it.label }}</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="c in sys.codes" :key="c.code">
                  <td>{{ c.name }}</td>
                  <td v-for="it in flatAxis" :key="it.idx"
                      :class="{zero: isZero(c.hours[it.idx])}">
                    {{ cellVal(c.hours[it.idx]) }}
                  </td>
                  <td><b>{{ cellVal(c.day) }}</b></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>

<script src="/static/vendor/vue.global.prod.js"></script>
<script>
const { createApp } = Vue;

const app = createApp({
  data() {
    return {
      dates: [],
      selectedDates: [],
      dateOpen: false,
      products: [],
      productCode: '',
      productKw: '',
      comboOpen: false,
      detail: null,
      loading: false,
      fetching: false,
      fetchMsg: '',
      metric: 'impressions',
      // 与赛狐「小时维度指标分析」页面一致的可看指标
      metrics: [
        { key: 'impressions', label: '曝光' },
        { key: 'clicks', label: '点击' },
        { key: 'ctr', label: 'CTR' },
        { key: 'cost', label: '花费' },
        { key: 'cpc', label: 'CPC' },
        { key: 'orders', label: '订单' },
        { key: 'sales', label: '销售额' },
        { key: 'acos', label: 'ACOS' },
        { key: 'roas', label: 'ROAS' },
        { key: 'cvr', label: 'CVR' },
        { key: 'addToCart', label: '加购' },
        { key: 'detailPageViews', label: '详情页浏览' },
      ],
      // 赛狐「小时维度指标分析」里的其余列（后端全量透传，选到即用）
      metricNames: {
        adCost: '花费', adSale: '广告销售额', adOrderNum: '广告订单',
        adCostPerClick: 'CPC', adCostPercentage: '花费占比',
        cpm: 'CPM', vcpm: 'vCPM', cpa: 'CPA',
        addToCartRate: '加购率', eCPAddToCart: '加购成本',
        adSaleNum: '销量', adSelfSaleNum: '本品销量', adOtherSaleNum: '他品销量',
        adSales: '广告销售额', adOtherSales: '他品销售额', adOtherOrderNum: '他品订单',
        orderNum: '订单量', advertisingUnitPrice: '广告单价',
        impressionShare: '曝光份额', topImpressionShare: '首页顶部曝光份额',
        impressionRank: '曝光排名', impressionsPercentage: '曝光占比',
        clickPercentage: '点击占比', adSalePercentage: '销售额占比',
        viewImpressions: '展示量', viewabilityRate: '可见度',
        brandedSearches: '品牌搜索', cumulativeReach: '累计触达',
        ordersNewToBrandFTD: '新客订单', salesNewToBrandFTD: '新客销售额',
        unitsOrderedNewToBrandFTD: '新客销量',
        newToBrandDetailPageViews: '新客详情页浏览',
        video5SecondViews: '视频5秒播放', videoCompleteViews: '视频完整播放',
        acots: 'ACoTS', asots: 'ASoTS', acoas: 'ACoAS', asoas: 'ASoAS',
        adOrderNumPercentage: '订单占比', orderNumPercentage: '订单量占比',
        adSaleNumPercentage: '销量占比', viewImpressionsPercentage: '展示量占比',
        selfSalesPercentage: '本品销售额占比', selfOrderNumPercentage: '本品订单占比',
        selfSaleNumPercentage: '本品销量占比', otherSalesPercentage: '他品销售额占比',
        otherOrderNumPercentage: '他品订单占比',
        otherSaleNumPercentage: '他品销量占比', otherOrderNumPercent: '他品订单占比',
        ordersNewToBrandPercentageFTD: '新客订单占比',
        orderRateNewToBrandFTD: '新客订单率',
        salesRateNewToBrandFTD: '新客销售额占比',
        unitsOrderedRateNewToBrandFTD: '新客销量占比',
        video5SecondViewRate: '视频5秒播放率',
        videoFirstQuartileViews: '视频25%播放',
        videoMidpointViews: '视频50%播放',
        videoThirdQuartileViews: '视频75%播放',
        videoUnmutes: '视频取消静音',
        viewClickThroughRate: '展示点击率', maxTopIs: '首页顶部最大份额',
        impressionsFrequencyAverage: '平均展示频次',
        selfAdvertisingUnitPrice: '本品广告单价',
        otherAdvertisingUnitPrice: '他品广告单价',
      },
      palette: ['#2b5fd0', '#02a15c', '#f08c22', '#9099a6'],
      imgUrl: '',
    };
  },
  computed: {
    o() {
      return this.detail ? this.detail.overall : { impressions: 0, clicks: 0, cost: 0,
        orders: 0, sales: 0, ctr: 0, cpc: 0, acos: 0, roas: 0, cvr: 0 };
    },
    filteredProducts() {
      const k = (this.productKw || '').trim().toLowerCase();
      if (!k) return this.products;
      return this.products.filter(p => [p.sku, p.asin, p.title]
        .filter(Boolean).join(' ').toLowerCase().includes(k));
    },
    currentProductText() {
      const p = this.products.find(x => String(x.product_code) === String(this.productCode));
      return p ? `${p.sku} / ${p.asin} · 曝光 ${this.fmt(p.imp)}` : '输入 SKU / ASIN 筛选';
    },
    dateText() {
      const n = this.selectedDates.length;
      if (!n) return '';
      if (n === 1) return this.selectedDates[0];
      const s = this.selectedDates.slice().sort();
      return `${s[0]} 等 ${n} 天`;
    },
    dateSummary() {
      if (!this.detail) return '';
      const ds = this.detail.dates || [];
      if (ds.length <= 1) return `${this.detail.date} · 24 小时`;
      return `${ds[0].slice(5)} ~ ${ds[ds.length - 1].slice(5)} · ${ds.length} 天 · `
        + `${(this.detail.axis || []).length} 小时`;
    },
    flatAxis() {
      return (this.detail && this.detail.axis) || [];
    },
    dayGroups() {
      const out = [];
      this.flatAxis.forEach(it => {
        let g = out[out.length - 1];
        if (!g || g.date !== it.date) { g = { date: it.date, items: [] }; out.push(g); }
        g.items.push(it);
      });
      return out;
    },
    hoursLabel() {
      const n = this.flatAxis.length;
      return n > 24 ? `${n / 24} 天 · ${n} 小时累计` : '24 小时累计';
    },
    metricLabel() {
      const m = this.metrics.find(x => x.key === this.metric);
      return m ? m.label : this.metricName(this.metric);
    },
    extraMetricKeys() {
      const core = this.metrics.map(m => m.key);
      const keys = new Set();
      (this.detail && this.detail.systems ? this.detail.systems : []).forEach(s =>
        s.codes.forEach(c => c.hours.forEach(h => Object.keys(h).forEach(k => keys.add(k)))));
      return [...keys].filter(k => !core.includes(k)).sort((a, b) => {
        const an = !!this.metricNames[a];
        const bn = !!this.metricNames[b];
        if (an !== bn) return an ? -1 : 1;      // 有中文名的排前面
        return this.metricName(a).localeCompare(this.metricName(b), 'zh-CN');
      });
    },
    dense() {
      return this.flatAxis.length > 24;
    },
  },
  methods: {
    fmt(v) { return (v || 0).toLocaleString('zh-CN'); },
    money(v) { return '¥' + (Number(v) || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
    color(sys, code) { return this.palette[(code - 1) % this.palette.length]; },
    isPct(k) {
      return ['ctr', 'cvr', 'acos'].includes(k)
        || /Rate$|Percentage$|Percent$/.test(k || '');
    },
    isMoney(k) {
      return ['cost', 'sales', 'cpc', 'cpm', 'cpa', 'adCostPerClick',
        'adSales', 'adSale', 'advertisingUnitPrice', 'selfAdvertisingUnitPrice',
        'otherAdvertisingUnitPrice'].includes(k);
    },
    metricName(k) { return this.metricNames[k] || k; },
    onMetricPick(e) {
      const v = e.target.value;
      if (v) this.metric = v;
      e.target.value = '';
    },
    rawVal(m, key) {
      if (!m) return 0;
      const v = m[key === undefined ? this.metric : key];
      return (v === undefined || v === null) ? 0 : v;
    },
    fmtMetric(v, key) {
      const k = key || this.metric;
      const n = Number(v);
      if (!isFinite(n)) return String(v);
      if (this.isMoney(k)) return this.money(n);
      if (this.isPct(k)) return n.toFixed(2) + '%';
      if (k === 'roas') return n.toFixed(2);
      return Number.isInteger(n) ? n.toLocaleString('zh-CN') : n.toFixed(2);
    },
    metricText(m) { return this.fmtMetric(this.rawVal(m), this.metric); },
    cellVal(m) {
      const n = Number(this.rawVal(m));
      if (!isFinite(n)) return String(this.rawVal(m));
      if (this.isPct(this.metric)) return n.toFixed(1);
      if (this.isMoney(this.metric)) return n.toFixed(2);
      return Number.isInteger(n) ? n : n.toFixed(2);
    },
    isZero(m) { return !Number(this.rawVal(m)); },
    maxOf(sys) {
      let mx = 0;
      sys.codes.forEach(c => c.hours.forEach(h => {
        const v = Number(this.rawVal(h)) || 0;
        if (v > mx) mx = v;
      }));
      return mx || 1;
    },
    pct(sys, c, hour) {
      const mx = this.maxOf(sys);
      const v = Number(this.rawVal(c.hours[hour]) || 0);
      return (v / mx * 100).toFixed(1) + '%';
    },
    async loadDates() {
      const r = await fetch('/api/ads-fact/dates').then(x => x.json());
      this.dates = r.dates || [];
      if (this.dates.length && !this.selectedDates.length) {
        this.selectedDates = [this.dates[0]];
        await this.loadProducts();
      }
    },
    async loadProducts() {
      if (!this.selectedDates.length) { this.products = []; this.detail = null; return; }
      const base = this.selectedDates.slice().sort()[0];
      const r = await fetch('/api/ads-fact/products?date=' + base).then(x => x.json());
      this.products = r.products || [];
      if (this.products.length) {
        const keep = this.products.find(p => String(p.product_code) === String(this.productCode));
        this.productCode = keep ? keep.product_code : this.products[0].product_code;
        await this.loadDetail();
      } else {
        this.detail = null;
      }
    },
    async loadDetail() {
      if (!this.selectedDates.length || !this.productCode) return;
      this.loading = true;
      try {
        const ds = this.selectedDates.slice().sort().join(',');
        const url = `/api/ads-fact/detail?dates=${ds}&product_code=${this.productCode}`;
        const r = await fetch(url).then(x => x.json());
        if (r.detail === null || r.systems === undefined) { this.detail = null; return; }
        this.detail = r;
      } finally {
        this.loading = false;
      }
    },
    pickProduct(p) {
      this.productCode = p.product_code;
      this.productKw = '';
      this.comboOpen = false;
      this.loadDetail();
    },
    onDatesChange() {
      // 连续勾选时只发最后一次请求
      clearTimeout(this._dt);
      this._dt = setTimeout(() => {
        this.productCode = '';
        this.productKw = '';
        this.comboOpen = false;
        this.loadProducts();
      }, 220);
    },
    async startFetch() {
      if (this.fetching || !this.productCode || !this.selectedDates.length) return;
      this.fetching = true;
      this.fetchMsg = '提交中…';
      try {
        const r = await fetch('/api/ads-fact/fetch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dates: this.selectedDates, product_code: this.productCode }),
        }).then(x => x.json());
        if (!r.task_id) {
          this.fetching = false;
          this.fetchMsg = r.detail || '提交失败';
          return;
        }
        const tick = async () => {
          const st = await fetch('/api/ads-fact/fetch/' + r.task_id).then(x => x.json());
          if (st.message) this.fetchMsg = st.message;
          if (st.status === 'running') { setTimeout(tick, 1200); return; }
          this.fetching = false;
          if (st.status === 'success') {
            await this.loadDates();
            await this.loadProducts();
          } else {
            this.fetchMsg = '失败：' + (st.message || '未知错误');
          }
        };
        setTimeout(tick, 1000);
      } catch (e) {
        this.fetching = false;
        this.fetchMsg = '请求失败：' + e.message;
      }
    },
  },
  mounted() {
    this.loadDates();
  },
});

/* 点空白处收起下拉 */
app.directive('click-outside', {
  mounted(el, binding) {
    el.__co = (e) => { if (!el.contains(e.target)) binding.value(e); };
    document.addEventListener('click', el.__co, true);
  },
  unmounted(el) { document.removeEventListener('click', el.__co, true); },
});

app.mount('#app');
</script>
